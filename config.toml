# Personal AI Tech Radio — user configuration
# All user-tunable settings live here. No secrets: the OpenAI API key is
# read from the OPENAI_API_KEY environment variable, never from this file.

[llm]
provider = "openai"          # "ollama" | "openai" — set back to "ollama" to run fully local/offline
model = "gpt-4o-mini"        # OpenAI: e.g. "gpt-4o-mini", "gpt-4o", "gpt-5" (whatever your account has access to)
                              # Ollama: e.g. "llama3.2:1b"
temperature = 0.75

[topics]
# Drives both RSS tag selection and RAG query expansion.
focus = ["AI", "machine learning", "React", "JavaScript", "LLM fine-tuning"]

[rag]
n_queries = 5                 # number of expanded search queries per run
n_results = 20                # max retrieved chunks before diversity filtering
chunk_size = 150               # words per chunk (embedding model limit ~256 tokens)
overlap = 30                    # words of overlap between adjacent chunks
max_chunks_per_article = 2      # caps how many chunks from one article can dominate context
articles_per_feed = 6           # max articles fetched per RSS feed

[audio]
language = "en"
tts_backend = "auto"           # "auto" | "gtts" | "pyttsx3" | "say"

